<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 Routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;family=Rubik:wght@700&amp;display=swap">
<style>body{margin:0;background:#888}button{font-family:Inter,sans-serif;cursor:pointer}.wrap{width:390px;height:844px;margin:0 auto}</style>
</head>
<body>
<div class="wrap">

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;color:#1a1a1a;box-sizing:border-box">

<div style="position:absolute;top:56px;left:16px;right:16px;padding:12px;border-radius:18px;background:#fff;box-shadow:0 2px 10px #0003;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:10px;height:40px;border-radius:12px;background:#f0f0f0;padding:0 12px;font-size:14px"><button aria-label="Pin route start on map" style="width:34px;height:34px;flex:none;border:0;border-radius:17px;background:transparent;display:grid;place-items:center"><img src="../images/pin.png" alt="" style="width:22px;height:22px"></button><input id="route-origin" aria-label="Starting point" placeholder="Start place or address" style="min-width:0;flex:1;border:0;background:transparent;font:14px Inter,sans-serif;outline:none"></div>
<div style="display:flex;align-items:center;gap:10px;height:40px;border-radius:12px;background:#f0f0f0;padding:0 12px;font-size:14px"><button aria-label="Pin route destination on map" style="width:34px;height:34px;flex:none;border:0;border-radius:17px;background:transparent;display:grid;place-items:center"><img src="../images/gpin.png" alt="" style="width:22px;height:22px"></button><input id="route-destination" aria-label="Destination" placeholder="Destination place or address" style="min-width:0;flex:1;border:0;background:transparent;font:14px Inter,sans-serif;outline:none"></div></div>


<div style="position:absolute;left:12px;right:12px;bottom:100px;padding:14px;border-radius:18px;background:#fff;box-shadow:0 4px 18px #0003">
<div style="font-size:13px;font-weight:700;color:#a8321a"><span id="route-status">Enter a destination to find a walking route</span></div>
<div style="font-size:15px;font-weight:700;margin-top:6px"><span id="route-summary">Route preview</span></div>
<div style="font-size:12px;color:#555;margin:2px 0 10px">Accessibility and lighting details are not yet verified by the routing data.</div>
<button style="margin-top:10px;width:100%;height:48px;border-radius:24px;border:0;background:#5fbe2a;color:#10300a;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z" fill="#10300a"></path></svg>Find route</button><button id="route-detour" style="display:none;margin-top:8px;width:100%;height:44px;border-radius:22px;border:1px solid #5fbe2a;background:transparent;color:#5fbe2a;font-size:14px;font-weight:700;align-items:center;justify-content:center">Find detour</button></div><div style="position:absolute;left:0;right:0;bottom:0;height:64px;isolation:isolate;display:flex;align-items:center;justify-content:space-between;padding:0 22px"><svg width="390" height="64" viewBox="0 0 390 64" style="position:absolute;left:0;top:0;z-index:-1" aria-hidden="true"><defs><linearGradient id="nb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e2e"></stop><stop offset="1" stop-color="#1c1c1c"></stop></linearGradient></defs><path fill="url(#nb)" d="M0 0H131Q145 0 146.5 14A50 50 0 0 0 243.5 14Q245 0 259 0H390V64H0Z"></path></svg><div style="display:flex;gap:2px"><button aria-label="Map" style="width:50px;height:50px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d6d6d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"></path></svg></button><button aria-label="Community" style="width:50px;height:50px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d6d6d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></button></div><div style="display:flex;gap:2px"><button aria-label="Routes" style="width:50px;height:50px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5fbe2a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"></path></svg></button><button aria-label="Rewards" style="width:50px;height:50px;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d6d6d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v2a3 3 0 0 0 4 3M16 6h4v2a3 3 0 0 1-4 3M12 13v4M8 20h8"></path></svg></button></div><button aria-label="Report an issue" style="position:absolute;left:151px;top:-42px;width:88px;height:88px;border-radius:50%;border:5px solid #b9e59a;background:#2b2b2b;display:flex;align-items:center;justify-content:center;box-shadow:none"><img src="../images/cam.png" alt="" style="width:44px;height:44px"></button></div>
</div>
</div>
<script src="../runtime.js"></script></body>
</html>

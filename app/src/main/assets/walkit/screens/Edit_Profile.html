<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7b Edit Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;family=Rubik:wght@700&amp;display=swap">
<style>body{margin:0;background:#888}button{font-family:Inter,sans-serif;cursor:pointer}.wrap{width:390px;height:844px;margin:0 auto}</style>
</head>
<body>
<div class="wrap">

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:#1a1a1a;box-sizing:border-box">
<div style="position:absolute;top:0;left:0;right:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 14px;box-sizing:border-box;background:#fff"><div style="width:84px"><img src="../images/logo.png" alt="Walk It" style="width:30px;height:40px;object-fit:contain;margin-bottom:-4px"></div><h1 style="margin:0;font-size:18px;font-weight:700">Edit profile</h1><div style="width:84px;display:flex;justify-content:flex-end;align-items:center;gap:4px"><button aria-label="Notifications" style="width:44px;height:44px;margin:-8px 0;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"></path></svg></button><div style="width:28px;height:28px;border-radius:50%;background:#c9c9c9" role="img" aria-label="Profile"></div></div></div>
<div style="position:absolute;top:104px;left:16px;right:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="position:relative;width:88px;height:88px"><div style="width:88px;height:88px;border-radius:50%;border:4px solid #5fbe2a;background:#d9d9d9;box-sizing:border-box" role="img" aria-label="Profile picture"></div><div style="position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:#2b2b2b;border:2px solid #fff;display:flex;align-items:center;justify-content:center"><img src="../images/cam.png" alt="Change photo" style="width:18px;height:18px"></div></div><button style="min-height:40px;border:0;background:none;font-size:13px;font-weight:600;color:#3d7f12">Change photo</button></div>
<div><div style="font-size:12px;font-weight:600;color:#444;margin:0 0 6px 8px">Display name</div><div style="height:50px;border:1px solid #cfcfcf;border-radius:25px;padding:0 20px;display:flex;align-items:center;font-size:14px;color:#1a1a1a">Juan Dela Cruz</div></div>
<div><div style="font-size:12px;font-weight:600;color:#444;margin:0 0 6px 8px">Username</div><div style="height:50px;border:1px solid #cfcfcf;border-radius:25px;padding:0 20px;display:flex;align-items:center;font-size:14px;color:#1a1a1a">@juan.walks</div><div style="font-size:12px;color:#3d7f12;font-weight:600;margin:4px 0 0 8px">✓ Username is available</div></div>
<div><div style="font-size:12px;font-weight:600;color:#444;margin:0 0 6px 8px">Bio</div><div style="height:76px;border:1px solid #cfcfcf;border-radius:20px;padding:12px 20px;font-size:14px;line-height:1.4;color:#1a1a1a;box-sizing:border-box">Walking Sampaloc daily and reporting broken paths so everyone can get around safely.</div></div>
<div><div style="font-size:12px;font-weight:600;color:#444;margin:0 0 6px 8px">Accessibility preferences</div><div style="display:flex;flex-wrap:wrap;gap:8px"><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #2b2b2b;background:#2b2b2b;color:#fff;font-size:13px;font-weight:500;white-space:nowrap">Wheelchair access</button><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #2b2b2b;background:#2b2b2b;color:#fff;font-size:13px;font-weight:500;white-space:nowrap">Fewer stairs</button><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #d0d0d0;background:#fff;color:#333;font-size:13px;font-weight:500;white-space:nowrap">Smooth path</button><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #2b2b2b;background:#2b2b2b;color:#fff;font-size:13px;font-weight:500;white-space:nowrap">Well lit</button></div></div></div>
<div style="position:absolute;left:16px;right:16px;bottom:24px;display:flex;gap:10px"><button style="flex:1;height:52px;border-radius:26px;border:1px solid #cfcfcf;background:#fff;color:#222;font-size:15px;font-weight:600">Cancel</button><button style="flex:1.4;height:52px;border-radius:26px;border:0;background:#5fbe2a;color:#10300a;font-size:15px;font-weight:700">Save changes</button></div>
</div>
</div>
<script src="../runtime.js"></script></body>
</html>

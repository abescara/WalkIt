<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3b Report Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;family=Rubik:wght@700&amp;display=swap">
<style>body{margin:0;background:#888}button{font-family:Inter,sans-serif;cursor:pointer}.wrap{width:390px;height:844px;margin:0 auto}</style>
</head>
<body>
<div class="wrap">

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:#1a1a1a;box-sizing:border-box">
<div style="position:absolute;top:0;left:0;right:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 14px;box-sizing:border-box;background:#fff"><div style="width:84px"><img src="../images/logo.png" alt="Walk It" style="width:30px;height:40px;object-fit:contain;margin-bottom:-4px"></div><h1 style="margin:0;font-size:18px;font-weight:700">Report preview</h1><div style="width:84px;display:flex;justify-content:flex-end;align-items:center;gap:4px"><button aria-label="Notifications" style="width:44px;height:44px;margin:-8px 0;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"></path></svg></button><div style="width:28px;height:28px;border-radius:50%;background:#c9c9c9" role="img" aria-label="Profile"></div></div></div>
<div style="position:absolute;top:108px;left:16px;right:16px;bottom:100px;overflow:hidden;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#e7f6dc;color:#2f6a0c;font-size:13px;font-weight:600"><img src="../images/pin.png" alt="" style="width:20px;height:20px">Your report is now on the map</div>
<div style="padding:14px;border-radius:18px;border:1px solid #e3e3e3;box-shadow:0 4px 14px #0001">
<div style="height:130px;border-radius:12px;background:#cfcfcf;position:relative;overflow:hidden"><img id="submitted-preview" alt="Submitted report photo" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><span id="submitted-category" style="position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;background:#2b2b2b;color:#fff">Report</span></div>
<div id="submitted-photo-thumbs" aria-label="Additional submitted photos" style="display:none"></div>
<div id="submitted-description" style="font-size:13px;line-height:1.4;margin-top:10px">Your report description</div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:#555"><img src="../images/gpin.png" alt="" style="width:16px;height:16px">Padre Paredes St, Sampaloc, Manila</div>
<div style="margin-top:8px;font-size:11px;font-weight:600;color:#3d7f12">Posted just now · Not yet confirmed</div></div>
<div style="height:96px;border-radius:14px;position:relative;overflow:hidden;background:#e4e4e4"><div style="position:absolute;left:175px;top:24px"><img src="../images/pin.png" alt="" style="width:40px;height:40px"></div><span style="position:absolute;left:10px;bottom:8px;font-size:12px;color:#444;background:#fff;padding:4px 8px;border-radius:10px">Visible to nearby walkers</span></div>
<button style="height:48px;border-radius:24px;border:0;background:#5fbe2a;color:#10300a;font-size:15px;font-weight:700">Post on forum</button>
<button style="height:44px;border-radius:22px;border:1px solid #cfcfcf;background:#fff;color:#333;font-size:14px;font-weight:600">Done</button></div><button style="position:absolute;left:16px;right:16px;bottom:24px;height:52px;border-radius:26px;border:0;background:#111;color:#fff;font-size:15px;font-weight:700">Back to map</button>
</div>
</div>
<script src="../runtime.js"></script></body>
</html>

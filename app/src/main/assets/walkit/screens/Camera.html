<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3a Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;family=Rubik:wght@700&amp;display=swap">
<style>body{margin:0;background:#888}button{font-family:Inter,sans-serif;cursor:pointer}.wrap{width:390px;height:844px;margin:0 auto}</style>
</head>
<body>
<div class="wrap">

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;color:#1a1a1a;box-sizing:border-box">

<div style="position:absolute;inset:0;background:transparent"></div>
<div style="position:absolute;top:24px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center"><button aria-label="Close camera" style="width:48px;height:48px;border:0;border-radius:50%;background:#0009;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><span style="padding:10px 16px;border-radius:22px;background:#0009;color:#fff;font-size:13px">Capture the path issue</span><button aria-label="Flash" style="width:48px;height:48px;border:0;border-radius:50%;background:#0009;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"></path></svg></button></div>
<div style="position:absolute;top:170px;left:40px;right:40px;height:420px"><svg width="36" height="36" viewBox="0 0 36 36" style="position:absolute;left:0;top:0;transform:rotate(0deg)" aria-hidden="true"><path d="M1 35V1H35" fill="none" stroke="#5fbe2a" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"></path></svg><svg width="36" height="36" viewBox="0 0 36 36" style="position:absolute;right:0;top:0;transform:rotate(90deg)" aria-hidden="true"><path d="M1 35V1H35" fill="none" stroke="#5fbe2a" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"></path></svg><svg width="36" height="36" viewBox="0 0 36 36" style="position:absolute;right:0;bottom:0;transform:rotate(180deg)" aria-hidden="true"><path d="M1 35V1H35" fill="none" stroke="#5fbe2a" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"></path></svg><svg width="36" height="36" viewBox="0 0 36 36" style="position:absolute;left:0;bottom:0;transform:rotate(270deg)" aria-hidden="true"><path d="M1 35V1H35" fill="none" stroke="#5fbe2a" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"></path></svg>
<div style="position:absolute;left:0;right:0;bottom:-48px;text-align:center;color:#fff;font-size:11px">Get close and include the surrounding path</div></div>
<button id="camera-done" aria-label="Done taking photos" style="display:none;position:absolute;top:24px;right:76px;padding:0 16px;height:48px;border:0;border-radius:24px;background:#2563eb;color:#fff;font-size:14px;font-weight:700"></button>
<div style="position:absolute;left:0;right:0;top:660px;display:flex;justify-content:center"><span style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:#0009;color:#fff;font-size:12px"><img src="../images/gpin.png" alt="" style="width:14px;height:14px;filter:brightness(0) invert(1)">Location tagged after capture</span></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:188px;background:linear-gradient(transparent,#000b 28%,#000 55%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 24px;box-sizing:border-box;gap:17px">
<div style="height:40px;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px;border-radius:24px;background:#0009"><button aria-label="Single photo mode" style="height:36px;padding:0 18px;border:0;border-radius:20px;background:#fff;color:#111;font-size:13px;font-weight:600">Single</button><button aria-label="Batch photo mode" style="height:36px;padding:0 18px;border:0;border-radius:20px;background:transparent;color:#fff;font-size:13px;font-weight:600">Batch</button></div>
<div style="width:100%;display:flex;align-items:center;justify-content:space-around">
<button aria-label="Open gallery" style="width:56px;height:56px;border-radius:14px;border:2px solid #fff;background:#ffffff33;color:#fff;font-size:11px;font-weight:600">Gallery</button>
<button aria-label="Take photo" style="width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#ffffffaa;box-shadow:0 0 0 3px #0008 inset"></button>
<button aria-label="Flip camera" style="width:48px;height:48px;border:0;border-radius:50%;background:#ffffff26;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"></path></svg></button></div></div>
</div>
</div>
<script src="../runtime.js"></script></body>
</html>

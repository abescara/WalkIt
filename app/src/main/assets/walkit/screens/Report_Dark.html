<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 Report · Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@700;800&amp;family=Rubik:wght@700&amp;display=swap">
<style>body{margin:0;background:#888}button{font-family:Inter,sans-serif;cursor:pointer}.wrap{width:390px;height:844px;margin:0 auto}</style>
</head>
<body>
<div class="wrap">

<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#121212;font-family:Inter,sans-serif;color:#f2f2f2;box-sizing:border-box">
<div style="position:absolute;top:0;left:0;right:0;height:96px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 14px;box-sizing:border-box;background:#121212"><div style="width:84px"><img src="../images/logo.png" alt="Walk It" style="width:30px;height:40px;object-fit:contain;margin-bottom:-4px"></div><h1 style="margin:0;font-size:18px;font-weight:700">Report an issue</h1><div style="width:84px;display:flex;justify-content:flex-end;align-items:center;gap:4px"><button aria-label="Notifications" style="width:44px;height:44px;margin:-8px 0;border:0;background:none;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"></path></svg></button><div style="width:28px;height:28px;border-radius:50%;background:#4a4a4a" role="img" aria-label="Profile"></div></div></div>
<div style="position:absolute;top:110px;left:16px;right:16px;bottom:100px;overflow:hidden;display:flex;flex-direction:column;gap:12px">
<div style="height:150px;border-radius:16px;position:relative;overflow:hidden;flex:none;background:#999"><svg viewBox="0 0 358 150" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" role="img" aria-label="Captured photo of a broken sidewalk" style="position:absolute;inset:0"><rect width="358" height="150" fill="#bcd3e3"></rect><rect y="0" width="358" height="48" fill="#a9c1d1"></rect><rect x="0" y="20" width="70" height="30" fill="#8fa2ad"></rect><rect x="290" y="12" width="68" height="38" fill="#8fa2ad"></rect><rect y="48" width="358" height="102" fill="#8e8e8e"></rect><path d="M140 48H218L338 150H20Z" fill="#bdbdbd"></path><path d="M179 48 100 150M179 48V150M179 48 260 150M150 62H208M130 82H228M105 108H253M70 138H288" stroke="#8a8a8a" stroke-width="1.5" fill="none"></path><path d="M150 150 168 128 160 112 188 98 176 84 196 70" stroke="#2f2f2f" stroke-width="3" fill="none"></path><path d="M170 118 205 112 210 132 176 138Z" fill="#6f6f6f" stroke="#2f2f2f" stroke-width="2"></path></svg><span style="position:absolute;left:10px;bottom:10px;padding:5px 10px;border-radius:14px;background:#00000099;color:#fff;font-size:11px">Photo added</span><button style="position:absolute;right:10px;top:10px;height:40px;padding:0 14px;border-radius:20px;border:0;background:#fffffff2;font-size:12px;font-weight:600;color:#222">Retake</button></div>
<div style="display:flex;flex-wrap:wrap;gap:8px"><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #f2f2f2;background:#f2f2f2;color:#111;font-size:13px;font-weight:500;white-space:nowrap">Broken sidewalk</button><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #3a3a3a;background:#1e1e1e;color:#e0e0e0;font-size:13px;font-weight:500;white-space:nowrap">Blocked path</button><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #3a3a3a;background:#1e1e1e;color:#e0e0e0;font-size:13px;font-weight:500;white-space:nowrap">No ramp</button><button style="height:44px;padding:0 16px;border-radius:22px;border:1px solid #3a3a3a;background:#1e1e1e;color:#e0e0e0;font-size:13px;font-weight:500;white-space:nowrap">Poor lighting</button></div>
<label style="font-size:12px;font-weight:600;color:#cfcfcf">Details</label>
<div style="height:80px;border:1px solid #3a3a3a;border-radius:12px;padding:10px;font-size:13px;color:#a5a5a5;box-sizing:border-box">Describe what is blocking the path…</div>
<div style="height:110px;border-radius:14px;position:relative;overflow:hidden;background:#e4e4e4"><div style="position:absolute;left:150px;top:30px"><img src="../images/pin.png" alt="" style="width:40px;height:40px"></div><span style="position:absolute;left:10px;bottom:8px;font-size:12px;color:#cfcfcf;background:#1e1e1e;padding:4px 8px;border-radius:10px">Padre Paredes St, Sampaloc · drag to adjust</span></div>
<button style="height:48px;border-radius:24px;border:0;background:#5fbe2a;color:#10300a;font-size:15px;font-weight:700">Place report on map</button></div><button style="position:absolute;left:16px;right:16px;bottom:24px;height:52px;border-radius:26px;border:0;background:#f2f2f2;color:#111;font-size:15px;font-weight:700">Back to map</button>
</div>
</div>
<script src="../runtime.js"></script></body>
</html>

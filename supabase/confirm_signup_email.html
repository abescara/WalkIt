<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#f4f7f2;font-family:Arial,sans-serif;color:#1d2b1a">
  <table role="presentation" style="width:100%;max-width:520px;margin:auto;border-collapse:collapse;background:#fff;border-radius:18px">
    <tr><td style="padding:36px 32px 16px">
      <div style="font-size:23px;font-weight:800;color:#4da91f">WalkIt</div>
      <h1 style="font-size:25px;line-height:1.25;margin:24px 0 10px">Confirm your email</h1>
      <p style="font-size:15px;line-height:1.6;margin:0">You’re one step away from sharing walking updates and helping others choose safer paths.</p>
      <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 24px;border-radius:24px;background:#5fbe2a;color:#12240c;text-decoration:none;font-size:15px;font-weight:700">Confirm email and open WalkIt</a></p>
      <p style="font-size:13px;line-height:1.6;color:#5b6658">If you didn’t create a WalkIt account, you can ignore this email.</p>
    </td></tr>
  </table>
</body>
</html>
